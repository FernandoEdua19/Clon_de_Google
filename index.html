<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Google Clone</title>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 id="titulo" >
                <img src="https://1000marcas.net/wp-content/uploads/2020/02/Google-Logo.png" alt="Logo de Google">
            </h1>
        </header>
        <main>
            <div id="barra_busqueda">
                <span class="material-icons">search</span>
                <input id="barra" type="text"/>

            </div>
            <div id="botones">
                <button id="boton_busqueda"> Buscar con Google</button>
                <button id="boton_suerte"> Me siento con suerte</button>
            </div>
        </main>
        <script src="script.js">
        </script>   
    </body>
